################################################################################
# HCMS - Home Climate Management System
# Version: 0.6
#
# Scripts — Reusable Device Control
#
# Changelog v0.6:
#   - Screens migrated from the HomeKit-relayed cover entities
#     (cover.living_1/living_2/slaapkamer) to the native Overkiz ones
#     (cover.screen_3/screen_2/screen_1) now that the TaHoma Switch runs
#     on the Local API — same physical screens, richer entities (position,
#     RSSI, priority-lock), no cloud round-trip. The HomeKit duplicates are
#     being removed from the registry.
#   - hcms_screens_close now closes to a graduated position from
#     sensor.hcms_screen_target_position instead of always fully closing —
#     see 20_templates.yaml. Storm/rain opening is unaffected (full open,
#     safety-driven, unchanged).
#
# Design principles:
#   - Scripts never read Climate Mode — only receive instructions
#   - Automations decide WHAT to do; scripts decide HOW to do it
#   - Every script is idempotent (safe to call repeatedly)
#   - Scripts respect the hcms_enabled master switch
#   - Every screen script sets hcms_screen_moving for 45s (covers ~34s travel)
#     so override detection does not misinterpret HCMS moves as human actions
#
# Actuators:
#   Screens:     cover.screen_1 (bedroom), cover.screen_2, cover.screen_3
#                (living room) — native Overkiz, always grouped
#   Ventilation: fan.none_vmb4ry_ventilatie_sp2_ventilatie_sp2
#                On = Level 3 (boost), Off = Level 1 (normal). Never fully off.
#   Airco:       fan.none_vmb4ry_airco_airco + duct fan always paired
#                On sequence: airco → 30s → duct fan
#                Off sequence: duct fan → 10s → airco
#   Ceiling fan: fan.create_wind_calm_local_tuya
#                Day (07:00–22:00): hcms_fan_day_speed (default 100%)
#                Night (22:00–07:00): hcms_fan_night_speed (default 30%)
################################################################################

script:

  ############################################################################
  # SCREENS
  ############################################################################

  hcms_screens_close:
    alias: "HCMS Screens — Close All"
    description: >
      Closes all three screens as a group, to the graduated position in
      sensor.hcms_screen_target_position (0 = fully closed, 100 = open) —
      not always fully closed. Sets hcms_screen_moving for 45s to prevent
      false override detection.
    icon: mdi:window-shutter
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_screen_control
        state: "on"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hcms_screen_moving
      - action: cover.set_cover_position
        target:
          entity_id:
            - cover.screen_1
            - cover.screen_2
            - cover.screen_3
        data:
          position: "{{ states('sensor.hcms_screen_target_position')|int(0) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_screen_automation
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - delay:
          seconds: 45
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hcms_screen_moving

  hcms_screens_open:
    alias: "HCMS Screens — Open All"
    description: >
      Opens all three screens as a group.
      Sets hcms_screen_moving for 45s to prevent false override detection.
    icon: mdi:window-shutter-open
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_screen_control
        state: "on"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hcms_screen_moving
      - action: cover.open_cover
        target:
          entity_id:
            - cover.screen_1
            - cover.screen_2
            - cover.screen_3
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_screen_automation
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - delay:
          seconds: 45
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hcms_screen_moving

  hcms_screens_open_override_immune:
    alias: "HCMS Screens — Open (Storm / Rain)"
    description: >
      Opens screens unconditionally — bypasses manual override.
      Used for rain and storm protection where safety wins over user preference.
    icon: mdi:weather-lightning-rainy
    mode: single
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hcms_screen_moving
      - action: cover.open_cover
        target:
          entity_id:
            - cover.screen_1
            - cover.screen_2
            - cover.screen_3
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.last_screen_automation
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - delay:
          seconds: 45
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hcms_screen_moving

  ############################################################################
  # VENTILATION
  ############################################################################

  hcms_ventilation_boost_on:
    alias: "HCMS Ventilation — Boost On (Level 3)"
    description: Fan on = Level 3. Never fully off, never Level 2.
    icon: mdi:fan-chevron-up
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_ventilation_control
        state: "on"
      - action: fan.turn_on
        target:
          entity_id: fan.none_vmb4ry_ventilatie_sp2_ventilatie_sp2

  hcms_ventilation_boost_off:
    alias: "HCMS Ventilation — Boost Off (Level 1)"
    description: Fan off = Level 1 (normal background). Does NOT stop ventilation.
    icon: mdi:fan-chevron-down
    mode: single
    sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.none_vmb4ry_ventilatie_sp2_ventilatie_sp2

  ############################################################################
  # AIRCO
  ############################################################################

  hcms_airco_on:
    alias: "HCMS Airco — On"
    description: >
      Starts airco then duct fan (30s delay for compressor stabilisation).
      Hard gate: refuses if binary_sensor.hcms_airco_permitted is off (night).
    icon: mdi:air-conditioner
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_airco_control
        state: "on"
      - condition: state
        entity_id: binary_sensor.hcms_airco_permitted
        state: "on"
      - action: fan.turn_on
        target:
          entity_id: fan.none_vmb4ry_airco_airco
      - delay:
          seconds: 30
      - action: fan.turn_on
        target:
          entity_id: fan.r4_stopcontacten_vmb4ryld_airco_vent_airco_vent

  hcms_airco_off:
    alias: "HCMS Airco — Off"
    description: Stops duct fan first (10s pause) then airco. Prevents warm air blowthrough.
    icon: mdi:air-conditioner
    mode: single
    sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.r4_stopcontacten_vmb4ryld_airco_vent_airco_vent
      - delay:
          seconds: 10
      - action: fan.turn_off
        target:
          entity_id: fan.none_vmb4ry_airco_airco

  ############################################################################
  # CEILING FAN
  ############################################################################

  hcms_fan_on:
    alias: "HCMS Ceiling Fan — On"
    description: >
      Bedroom ceiling fan at day speed (07:00–22:00) or night speed (22:00–07:00).
      Speeds configurable via input_number.hcms_fan_day_speed / hcms_fan_night_speed.
      Respects fan_manual_override — will not act if a human took control today.
    icon: mdi:fan
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_fan_control
        state: "on"
      - condition: state
        entity_id: input_boolean.fan_manual_override
        state: "off"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hcms_fan_moving
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_day_period
                state: "DAY"
            sequence:
              - action: fan.turn_on
                target:
                  entity_id: fan.create_wind_calm_local_tuya
                data:
                  percentage: "{{ states('input_number.hcms_fan_day_speed')|int(100) }}"
          - conditions:
              - condition: state
                entity_id: sensor.hcms_day_period
                state: "NIGHT"
            sequence:
              - action: fan.turn_on
                target:
                  entity_id: fan.create_wind_calm_local_tuya
                data:
                  percentage: "{{ states('input_number.hcms_fan_night_speed')|int(30) }}"
      - delay:
          seconds: 10
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hcms_fan_moving

  hcms_fan_off:
    alias: "HCMS Ceiling Fan — Off"
    description: >
      Turns off the bedroom ceiling fan.
      Respects fan_manual_override — will not act if a human took control today.
    icon: mdi:fan-off
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.hcms_fan_control
        state: "on"
      - condition: state
        entity_id: input_boolean.fan_manual_override
        state: "off"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hcms_fan_moving
      - action: fan.turn_off
        target:
          entity_id: fan.create_wind_calm_local_tuya
      - delay:
          seconds: 10
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hcms_fan_moving

  ############################################################################
  # COMPOSITE — Climate Response
  ############################################################################

  hcms_activate_free_cooling:
    alias: "HCMS Activate Free Cooling"
    description: >
      Ventilation boost on. Airco off. Screens per recommendation.
      Override blocks closing only — opening still works.
    icon: mdi:fan-auto
    mode: single
    sequence:
      - action: script.hcms_ventilation_boost_on
      - action: script.hcms_airco_off
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "CLOSE"
              - condition: state
                entity_id: input_boolean.screens_manual_override
                state: "off"
            sequence:
              - action: script.hcms_screens_close
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "OPEN"
            sequence:
              - action: script.hcms_screens_open

  hcms_activate_airco_cooling:
    alias: "HCMS Activate Airco Cooling"
    description: >
      Ventilation to L1. Airco on. Screens close if recommended and no override.
    icon: mdi:snowflake
    mode: single
    sequence:
      - action: script.hcms_ventilation_boost_off
      - action: script.hcms_airco_on
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "CLOSE"
              - condition: state
                entity_id: input_boolean.screens_manual_override
                state: "off"
            sequence:
              - action: script.hcms_screens_close

  hcms_deactivate_all_cooling:
    alias: "HCMS Deactivate All Cooling"
    description: >
      Ventilation L1, airco off, screens per recommendation.
      Override respected — will not close screens if override active.
    icon: mdi:check-circle-outline
    mode: single
    sequence:
      - action: script.hcms_ventilation_boost_off
      - action: script.hcms_airco_off
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "OPEN"
            sequence:
              - action: script.hcms_screens_open
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "CLOSE"
              - condition: state
                entity_id: input_boolean.screens_manual_override
                state: "off"
            sequence:
              - action: script.hcms_screens_close

  hcms_storm_protection:
    alias: "HCMS Storm Protection"
    description: >
      Opens screens unconditionally (override immune).
      Airco and ventilation boost off.
    icon: mdi:weather-lightning-rainy
    mode: single
    sequence:
      - action: script.hcms_screens_open_override_immune
      - action: script.hcms_ventilation_boost_off
      - action: script.hcms_airco_off
