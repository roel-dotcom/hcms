################################################################################
# HCMS - Home Climate Management System
# Version: 0.8
#
# Automation Engine
#
# Changelog v0.8:
#   - Fan override midnight reset now re-evaluates and re-triggers the fan
#     immediately after clearing fan_manual_override, instead of just
#     clearing the flag and waiting for some other trigger to happen to
#     fire. Closes a gap where a manual override set overnight (including
#     one set incidentally by e.g. an integration reconnect flipping the
#     entity's state) could leave the fan un-managed all night even though
#     the override itself correctly cleared at midnight.
#
# Changelog v0.7:
#   - Ceiling fan now runs continuously through the NIGHT period regardless
#     of needs_cooling (sleeping comfort, not active cooling — night speed
#     is already a gentle 30%). needs_cooling still gates the fan during DAY.
#
# Changelog v0.6:
#   - Removed incorrect ventilation runtime check from ACTIVE_COOLING transition
#   - Fixed airco minimum runtime guard (removed fragile fan state condition)
#   - RAIN_PROTECTION now excluded from periodic screen check
#   - DISABLED mode handled in startup init
#   - Removed screen cooldown guard (redundant with periodic check)
#   - Forecast refresh no longer gated on hcms_enabled
################################################################################

automation:

  ############################################################################
  # CLIMATE MODE RESPONSE
  # Central dispatcher — fires on every mode change.
  ############################################################################

  - id: hcms_climate_mode_response
    alias: "HCMS Climate Mode Response"
    description: Calls the correct composite script whenever Climate Mode changes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.hcms_climate_mode
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: template
        value_template: >
          {{ trigger.to_state.state != trigger.from_state.state }}
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "STORM_PROTECTION"
                  - "RAIN_PROTECTION"
            sequence:
              - action: script.hcms_storm_protection

          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "NIGHT_FLUSH"
                  - "FREE_COOLING"
            sequence:
              - action: script.hcms_activate_free_cooling

          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "ACTIVE_COOLING"
                  - "SOLAR_PRECOOL"
            sequence:
              - action: script.hcms_activate_airco_cooling

          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "IDLE"
                  - "WINTER_PASSIVE"
                  - "HOLIDAY"
                  - "DISABLED"
            sequence:
              - action: script.hcms_deactivate_all_cooling

  ############################################################################
  # AIRCO MINIMUM RUNTIME GUARD
  # Prevents airco from turning off too quickly when mode changes.
  # Waits 15 minutes before calling hcms_airco_off, then re-checks
  # that mode hasn't returned to a cooling state during the wait.
  ############################################################################

  - id: hcms_airco_minimum_runtime
    alias: "HCMS Airco Minimum Runtime Guard"
    description: >
      When Climate Mode leaves ACTIVE_COOLING/SOLAR_PRECOOL,
      wait 15 minutes before turning the airco off.
      Re-checks mode after the delay — if cooling resumed, skip the off call.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.hcms_climate_mode
    conditions:
      - condition: template
        value_template: >
          {{
            trigger.from_state.state in ['ACTIVE_COOLING', 'SOLAR_PRECOOL']
            and trigger.to_state.state not in ['ACTIVE_COOLING', 'SOLAR_PRECOOL']
          }}
    actions:
      - delay:
          minutes: 15
      - condition: template
        value_template: >
          {{ states('sensor.hcms_climate_mode') not in ['ACTIVE_COOLING', 'SOLAR_PRECOOL'] }}
      - action: script.hcms_airco_off

  ############################################################################
  # SCREEN MANUAL OVERRIDE DETECTION
  # Fires when a cover STARTS moving while hcms_screen_moving is off.
  # That means a human (not HCMS) initiated the move.
  ############################################################################

  - id: hcms_screen_manual_override_detect
    alias: "HCMS Screen Manual Override — Detect"
    description: >
      Human moved a cover (remote/wall switch) → sets screens_manual_override.
      Blocks auto-close for the rest of today.
      Triggers on opening/closing (start of movement) not final state,
      since hcms_screen_moving is only reliable for the first 45 seconds.
    triggers:
      - trigger: state
        entity_id:
          - cover.screen_1
          - cover.screen_2
          - cover.screen_3
        to:
          - "opening"
          - "closing"
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_screen_moving
        state: "off"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.screens_manual_override
      - action: logbook.log
        data:
          name: "HCMS"
          message: >
            Manual override activated — {{ trigger.entity_id }} moved by remote.
            Auto-close blocked for the rest of today.

  ############################################################################
  # SCREEN MANUAL OVERRIDE — MIDNIGHT RESET
  ############################################################################

  - id: hcms_screen_override_midnight_reset
    alias: "HCMS Screen Override — Midnight Reset"
    description: Clears screens_manual_override at midnight. Automation resumes next morning.
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.screens_manual_override
      - action: logbook.log
        data:
          name: "HCMS"
          message: "Screen manual override cleared — new day, automation resumed."

  ############################################################################
  # CEILING FAN MANUAL OVERRIDE DETECTION
  # Same pattern as screens — fires when the fan changes state while
  # hcms_fan_moving is off, meaning a human (app/remote) changed it.
  ############################################################################

  - id: hcms_fan_manual_override_detect
    alias: "HCMS Fan Manual Override — Detect"
    description: >
      Human changed the ceiling fan (Tuya app/remote) while hcms_fan_moving
      was off. Sets fan_manual_override to block auto-control for today.
    triggers:
      - trigger: state
        entity_id: fan.create_wind_calm_local_tuya
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_fan_moving
        state: "off"
      - condition: template
        value_template: >
          {{ trigger.to_state.state != trigger.from_state.state }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.fan_manual_override
      - action: logbook.log
        data:
          name: "HCMS"
          message: >
            Ceiling fan manual override activated — changed outside HCMS.
            Auto-control blocked for the rest of today.

  ############################################################################
  # CEILING FAN OVERRIDE — MIDNIGHT RESET
  ############################################################################

  - id: hcms_fan_override_midnight_reset
    alias: "HCMS Fan Override — Midnight Reset"
    description: >
      Clears fan_manual_override at midnight, then immediately re-evaluates
      whether the fan should be running (same conditions as HCMS Ceiling Fan
      — Start Cooling) instead of waiting for some other trigger to happen
      to fire. Self-heals overnight so a stray override doesn't leave the
      fan un-managed until morning.
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fan_manual_override
      - action: logbook.log
        data:
          name: "HCMS"
          message: "Fan manual override cleared — new day, automation resumed."
      - if:
          - condition: state
            entity_id: input_boolean.hcms_enabled
            state: "on"
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.hcms_needs_cooling
                state: "on"
              - condition: state
                entity_id: sensor.hcms_day_period
                state: "NIGHT"
        then:
          - action: script.hcms_fan_on

  ############################################################################
  # PERIODIC SCREEN CHECK
  # Single authority for screen decisions — runs every 15 minutes.
  # Handles sun position changes that happen within a stable Climate Mode.
  # Replaces the old screen cooldown guard (which was redundant).
  ############################################################################

  - id: hcms_periodic_screen_check
    alias: "HCMS Periodic Screen Check"
    description: >
      Re-evaluates screen recommendation every 15 minutes.
      Single authority for screen moves — no separate cooldown guard needed.
      Skips during STORM_PROTECTION and RAIN_PROTECTION (screens already open).
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.hcms_screen_control
        state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.hcms_climate_mode
            state:
              - "STORM_PROTECTION"
              - "RAIN_PROTECTION"
      - condition: template
        value_template: >
          {% set last = states('input_datetime.last_screen_automation') %}
          {% set cooldown = states('input_number.hcms_screen_cooldown')|float(15) %}
          {% if last in ['unknown', 'unavailable'] %}
            true
          {% else %}
            {{ ((as_timestamp(now()) - as_timestamp(last)) / 60) >= cooldown }}
          {% endif %}
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "CLOSE"
              - condition: state
                entity_id: input_boolean.screens_manual_override
                state: "off"
            sequence:
              - action: script.hcms_screens_close
          - conditions:
              - condition: state
                entity_id: sensor.hcms_screen_recommendation
                state: "OPEN"
            sequence:
              - action: script.hcms_screens_open

  ############################################################################
  # AIRCO DIRECT START
  # Watches hcms_airco_permitted directly — starts airco whenever permission
  # becomes true. This catches cases where mode was already ACTIVE_COOLING
  # when HCMS was enabled, or when needs_cooling transitions while mode
  # stays the same. Mirrors the fan cooling_on pattern.
  ############################################################################

  - id: hcms_airco_start
    alias: "HCMS Airco — Start When Permitted"
    description: >
      Starts airco whenever hcms_airco_permitted becomes on.
      Catches already-active cooling modes that don't trigger mode_response.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.hcms_airco_permitted
        to: "on"
      - trigger: state
        entity_id: input_boolean.hcms_enabled
        to: "on"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: binary_sensor.hcms_airco_permitted
        state: "on"
    actions:
      - action: script.hcms_airco_on

  ############################################################################
  # CEILING FAN
  ############################################################################

  - id: hcms_fan_cooling_on
    alias: "HCMS Ceiling Fan — Start Cooling"
    description: >
      Turns fan on when cooling is needed, or unconditionally during the
      NIGHT period (comfort airflow for sleeping — night speed is already
      a gentle 30%, not aggressive cooling, so it doesn't need a cooling
      call to justify running).
      Also fires when HCMS Day Period changes (day/night boundary, which
      shifts automatically on weekends), at startup / HCMS enable to catch
      already-hot conditions, and when the day/night speed sliders change
      so a running fan picks up the new speed immediately instead of
      waiting for the next day/night boundary.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.hcms_needs_cooling
        to: "on"
      - trigger: state
        entity_id: sensor.hcms_day_period
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.hcms_enabled
        to: "on"
      - trigger: state
        entity_id: input_number.hcms_fan_day_speed
      - trigger: state
        entity_id: input_number.hcms_fan_night_speed
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.hcms_needs_cooling
            state: "on"
          - condition: state
            entity_id: sensor.hcms_day_period
            state: "NIGHT"
    actions:
      - action: script.hcms_fan_on

  - id: hcms_fan_cooling_off
    alias: "HCMS Ceiling Fan — Stop Cooling"
    description: >
      Turns fan off during the DAY period once indoor temperature drops
      back to target. Excludes NIGHT — the fan runs continuously overnight
      for sleeping comfort regardless of active cooling need. Also fires on
      the day/night boundary itself, to stop a fan left running from the
      night once DAY starts with no cooling need.
    triggers:
      - trigger: state
        entity_id: binary_sensor.hcms_needs_cooling
        to: "off"
      - trigger: state
        entity_id: sensor.hcms_day_period
    conditions:
      - condition: state
        entity_id: input_boolean.hcms_enabled
        state: "on"
      - condition: state
        entity_id: sensor.hcms_day_period
        state: "DAY"
      - condition: state
        entity_id: binary_sensor.hcms_needs_cooling
        state: "off"
    actions:
      - action: script.hcms_fan_off

  - id: hcms_fan_disabled
    alias: "HCMS Ceiling Fan — HCMS Disabled"
    description: Turns fan off when HCMS master switch is turned off.
    triggers:
      - trigger: state
        entity_id: input_boolean.hcms_enabled
        to: "off"
    actions:
      - action: script.hcms_fan_off

  ############################################################################
  # FORECAST REFRESH
  # Not gated on hcms_enabled — forecast data should always be fresh
  # so it's available immediately when HCMS is re-enabled.
  ############################################################################

  - id: hcms_forecast_refresh
    alias: "HCMS Forecast Refresh"
    description: >
      Fetches IRM/KMI daily forecast every 3h and at startup.
      Runs regardless of hcms_enabled so data is always current.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/3"
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.lanaken
        data:
          type: daily
        response_variable: fc
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_today_max
        data:
          value: "{{ fc['weather.lanaken'].forecast[0].temperature | float(states('input_number.hcms_fc_today_max')|float(0)) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_today_min
        data:
          value: "{{ fc['weather.lanaken'].forecast[0].templow | float(states('input_number.hcms_fc_today_min')|float(0)) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_today_precip
        data:
          value: "{{ fc['weather.lanaken'].forecast[0].precipitation_probability | int(states('input_number.hcms_fc_today_precip')|int(0)) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hcms_fc_today_condition
        data:
          value: "{{ fc['weather.lanaken'].forecast[0].condition or states('input_text.hcms_fc_today_condition') }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_tomorrow_max
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].temperature | float(states('input_number.hcms_fc_tomorrow_max')|float(0)) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_tomorrow_min
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].templow | float(states('input_number.hcms_fc_tomorrow_min')|float(0)) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_tomorrow_precip
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].precipitation_probability | int(states('input_number.hcms_fc_tomorrow_precip')|int(0)) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_fc_night_low
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].templow | float(states('input_number.hcms_fc_night_low')|float(0)) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hcms_fc_tomorrow_condition
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].condition or states('input_text.hcms_fc_tomorrow_condition') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.hcms_fc_tomorrow_condition_2
        data:
          value: "{{ fc['weather.lanaken'].forecast[1].condition_2 or states('input_text.hcms_fc_tomorrow_condition_2') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hcms_forecast_updated
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  ############################################################################
  # AZIMUTH THRESHOLD TIME ESTIMATE
  # Tracks sun azimuth rate of change (degrees/minute) and extrapolates
  # forward to estimate what clock time it will cross 75° (sun reaches
  # windows) and 240° (sun leaves windows). Recalculates every 5 minutes,
  # so accuracy improves as the crossing approaches. Runs independently
  # of hcms_enabled since it's purely informational.
  ############################################################################

  - id: hcms_azimuth_time_estimate
    alias: "HCMS Azimuth Threshold Time Estimate"
    description: >
      Every 5 minutes, computes azimuth rate of change and estimates
      clock time for crossing 75° and 240° (the sun-on-windows range).
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          cur_az: "{{ states('sensor.sun_solar_azimuth') | float(0) }}"
          prev_az: "{{ states('input_number.hcms_prev_azimuth') | float(cur_az) }}"
          prev_ts: "{{ states('input_datetime.hcms_prev_azimuth_time') }}"
          elapsed_min: >
            {% if prev_ts in ['unknown', 'unavailable'] %}
              0
            {% else %}
              {{ ((as_timestamp(now()) - as_timestamp(prev_ts)) / 60) }}
            {% endif %}
          rate: >
            {% if elapsed_min | float(0) >= 1 %}
              {{ ((cur_az - prev_az) / (elapsed_min | float(1))) }}
            {% else %}
              0
            {% endif %}
          min_to_75: >
            {% if rate | float(0) > 0.001 %}
              {{ ((75 - cur_az) / (rate | float(0.001))) }}
            {% else %}
              -1
            {% endif %}
          min_to_240: >
            {% if rate | float(0) > 0.001 %}
              {{ ((240 - cur_az) / (rate | float(0.001))) }}
            {% else %}
              -1
            {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.hcms_est_sun_reach_75
        data:
          value: >
            {% if cur_az >= 75 %}
              Al bereikt vandaag
            {% elif min_to_75 | float(-1) > 0 and min_to_75 | float(-1) < 900 %}
              ~{{ (now() + timedelta(minutes=min_to_75|float(0))).strftime('%H:%M') }}
            {% else %}
              Onbekend
            {% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.hcms_est_sun_leave_240
        data:
          value: >
            {% if cur_az >= 240 %}
              Al voorbij vandaag
            {% elif min_to_240 | float(-1) > 0 and min_to_240 | float(-1) < 900 %}
              ~{{ (now() + timedelta(minutes=min_to_240|float(0))).strftime('%H:%M') }}
            {% else %}
              Onbekend
            {% endif %}
      - action: input_number.set_value
        target:
          entity_id: input_number.hcms_prev_azimuth
        data:
          value: "{{ cur_az }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hcms_prev_azimuth_time
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  ############################################################################
  # STARTUP INITIALISATION
  # Fires 30s after boot to let entities settle, then evaluates current mode.
  # Handles all modes including DISABLED.
  ############################################################################

  - id: hcms_startup_init
    alias: "HCMS Startup Initialisation"
    description: Forces mode evaluation 30s after HA starts.
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay:
          seconds: 30
      - action: logbook.log
        data:
          name: "HCMS"
          message: >
            HCMS initialised. Climate Mode: {{ states('sensor.hcms_climate_mode') }}.
            Reason: {{ states('sensor.hcms_climate_reason') }}
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "STORM_PROTECTION"
                  - "RAIN_PROTECTION"
            sequence:
              - action: script.hcms_storm_protection
          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "NIGHT_FLUSH"
                  - "FREE_COOLING"
            sequence:
              - action: script.hcms_activate_free_cooling
          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "ACTIVE_COOLING"
                  - "SOLAR_PRECOOL"
            sequence:
              - action: script.hcms_activate_airco_cooling
          - conditions:
              - condition: state
                entity_id: sensor.hcms_climate_mode
                state:
                  - "IDLE"
                  - "WINTER_PASSIVE"
                  - "HOLIDAY"
                  - "DISABLED"
            sequence:
              - action: script.hcms_deactivate_all_cooling
